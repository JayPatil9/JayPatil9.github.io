<p class="spare-me" style="--note-accent: {{ include.pcolor | default: '#f12a2a' }}; --note-bg: {{ include.scolor | default: '#e98888' }}; --note-text: {{ include.textcolor | default: '#1a1a1a' }}; border-radius: 5px; border-top: 15px solid var(--note-accent); background-color: var(--note-bg); color: var(--note-text); padding: 0.5em;">
    <b>{{ include.title }}:</b>
    {{ include.message }}
</p>
