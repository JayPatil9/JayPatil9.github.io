<head>
<script>
  let hasSentPostRequest = false;
  let viewTime = 0;
  let viewTimer;
  function startTimer() {
    viewTimer = setInterval(() => {
      viewTime += 1;
      if (viewTime >= 90 && !hasSentPostRequest) {
        clearInterval(viewTimer);
        sendPostRequest();
      }
    }, 1000);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      clearInterval(viewTimer);
    } else {
      startTimer();
    }
  });
  if(!document.hidden) {
    startTimer();
  }
  function sendPostRequest() {
    if (!hasSentPostRequest) {
      hasSentPostRequest = true;
      fetch(`https://portfolio--backend.vercel.app/api/views/{{ include.post_id }}`, {method: 'POST'})
        .then(() => {
          console.log('View count incremented.');
        })
        .catch(error => {
          hasSentPostRequest = false;
          console.error('Error incrementing view count:', error)
        });
    }
  };
  fetch(`https://portfolio--backend.vercel.app/api/views/{{ include.post_id }}`, {method: 'GET'})
    .then(response => response.json())
    .then(data => {
      console.log('Data from api:', data);
      const viewCountElement = document.getElementById('view-count');
      if (viewCountElement) {
        viewCountElement.textContent = `Views: ${data.views_count}`;
      }
    })
    .catch(error => console.error('Error fetching view count:', error));
</script>

</head>
